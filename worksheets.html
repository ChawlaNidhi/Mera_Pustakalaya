<head>
    <meta charset="UTF-8"> 
    <!-- 1. CRITICAL: Enables mobile layout and scaling scales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Pathshala</title>
    <style>
        /* 2. GLOBAL RESET & SIZING CONTROL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Crucial for layout math */
        }

        body {
            /* Fixes background image stretch and prevents duplicates */
            background: url("background.png") no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 3. WRAPPER CONTAINER */
        .container {
            width: 100%;
            max-width: 1200px; /* Limits size on massive desktop monitors */
            margin: 0 auto;    /* Centers everything on the screen */
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;           /* Pushes footer to the absolute bottom */
        }

        /* 4. RESPONSIVE NAVIGATION (Mobile-First) */
        .nav {
            display: flex;
            flex-direction: column; /* Stack menu items vertically on mobile phones */
            gap: 15px;              /* Replaces chaotic &nbsp; spacing */
            text-align: center;
            padding: 20px 0;
            color: darkgreen;
            font-size: 18px;
            font-weight: bold;
        }

        .nav_options {
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .nav_options:hover {
            color: brown;
        }

        /* 5. RESPONSIVE WELCOME HERO BOX */
        .welcome {
            color: brown;
            text-align: center;
            margin: 40px auto; /* Dynamically centers the content box */
            width: 100%;
            max-width: 750px;  /* Smoothly shrinks on mobile, limits on desktop */
            
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Controlled, readable text scaling */
        p {
            font-size: 1.5rem; /* Scales relative to the browser size */
            line-height: 1.5;
            margin-bottom: 25px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        /* 6. STICKY FOOTER */
        .footer {
            text-align: center;
            padding: 20px 0;
            margin-top: auto; /* Uses flex behavior to stick to screen bottom */
            font-size: 14px;
            color: #333;
        }

        /* 7. DESKTOP ADAPTATION (Media Query) */
        /* Changes behavior dynamically when screen width is wider than 768px */
        @media screen and (min-width: 768px) {
            .nav {
                flex-direction: row;       /* Changes menu from vertical stack back to a horizontal line */
                justify-content: center;   /* Spreads them out evenly or centers them */
                gap: 30px;                 /* Generates clean gaps between tabs */
            }

            p {
                font-size: 1.8rem;         /* Slightly larger text for bigger screens */
            }

            .footer {
                text-align: right;         /* Matches original design on desktop view only */
            }
        }

 .worksheet-table-container {
        width: 100%;
        max-width: 750px;
        margin: 20px auto;
        overflow-x: auto;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        padding: 10px;
    }

    .worksheet-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-family: sans-serif;
    }

    .worksheet-table th {
        background-color: darkgreen;
        color: white;
        padding: 12px 15px;
        font-size: 1.1rem;
        font-weight: bold;
    }

    .worksheet-table th:first-child {
        border-top-left-radius: 8px;
    }
    
    .worksheet-table th:last-child {
        border-top-right-radius: 8px;
    }

    .worksheet-table td {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        font-size: 1.1rem;
    }

    .worksheet-table tr:last-child td {
        border-bottom: none;
    }

    .worksheet-table tr:hover {
        background-color: rgba(204, 102, 0, 0.05); /* Light orange hover effect */
    }

    /* Worksheet specific link style */
    a.worksheet-link {
        color: #cc6600;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        transition: color 0.2s, transform 0.2s;
    }

    a.worksheet-link:hover {
        color: brown;
        transform: translateX(3px); /* Subtle nudge animation */
    }
    </style>
